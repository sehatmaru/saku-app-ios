name: Saku
options:
  developmentLanguage: id
  bundleIdPrefix: id.saku
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.47.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.2.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: App/Resources/Info.plist
    DEVELOPMENT_TEAM: ""

targets:
  Saku:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.saku.app
        INFOPLIST_FILE: App/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Resources/Saku.entitlements
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: SakuShare
  SakuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "UI"
    dependencies:
      - target: Saku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.saku.tests
  SakuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UI
    dependencies:
      - target: Saku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.saku.uitests
        TEST_TARGET_NAME: Saku
  SakuShare:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/Share
      - path: App/Shared/Utilities/ShareInbox.swift
      - path: App/Shared/Utilities/ImageReader.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.saku.app.share
        INFOPLIST_FILE: Extensions/Share/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/Share/SakuShare.entitlements
        SKIP_INSTALL: YES

schemes:
  Saku:
    build:
      targets:
        Saku: all
    run:
      config: Debug
      storeKitConfiguration: Tests/Saku.storekit
    test:
      config: Debug
      targets:
        - SakuTests
        - SakuUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
